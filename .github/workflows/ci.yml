name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout agent
        uses: actions/checkout@v4

      - name: Checkout maldi-ms-pipeline (local dependency)
        uses: actions/checkout@v4
        with:
          repository: Wang-13137/maldi-ms-pipeline
          path: maldi-ms-pipeline

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # maldi-ms-pipeline 通过 conftest 的 sys.path 注入（无需 pip 安装，
          # 避免触发其 pyproject 的 setuptools 配置问题），只需上面 checkout 到同级目录
          pip install -e .

      - name: Run tests
        run: pytest -q

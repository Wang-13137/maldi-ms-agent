name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MALDI_PIPELINE_SRC: ${{ github.workspace }}/maldi-ms-pipeline/src
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout agent
        uses: actions/checkout@v4

      - name: Checkout maldi-ms-pipeline (local dependency)
        uses: actions/checkout@v4
        with:
          repository: Wang-13137/maldi-ms-pipeline
          path: maldi-ms-pipeline

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # maldi-ms-pipeline 通过 conftest 的 sys.path 注入（无需 pip 安装，
          # 避免触发其 pyproject 的 setuptools 配置问题），只需上面 checkout 到同级目录
          pip install -e .

      - name: Run tests
        run: pytest -q

      - name: Behavior eval gate (offline, no API key)
        # 行为门禁与 Python 版本无关；单测矩阵已覆盖版本差异，这里只跑一次
        if: matrix.python-version == '3.12'
        run: python scripts/eval_gate.py --out reports/eval_gate.json

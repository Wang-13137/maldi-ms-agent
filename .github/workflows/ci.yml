name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MALDI_PIPELINE_SRC: ${{ github.workspace }}/maldi-ms-pipeline/src
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout agent
        uses: actions/checkout@v4

      - name: Checkout maldi-ms-pipeline (local dependency)
        uses: actions/checkout@v4
        with:
          repository: Wang-13137/maldi-ms-pipeline
          path: maldi-ms-pipeline

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # maldi-ms-pipeline 通过 conftest 的 sys.path 注入（无需 pip 安装，
          # 避免触发其 pyproject 的 setuptools 配置问题），只需上面 checkout 到同级目录
          pip install -e .

      - name: Run tests
        run: pytest -q

      - name: Behavior eval gate (offline, no API key)
        # 行为门禁与 Python 版本无关；单测矩阵已覆盖版本差异，这里只跑一次
        if: matrix.python-version == '3.12'
        run: python scripts/eval_gate.py --out reports/eval_gate.json

      - name: MCP stdio protocol smoke test
        # 验证协议帧能起来、默认工具白名单生效（load_dataset 不应暴露）
        if: matrix.python-version == '3.12'
        run: |
          python scripts/run_mcp_server.py --once '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' > /tmp/mcp_tools.json
          python -c 'import json;d=json.load(open("/tmp/mcp_tools.json",encoding="utf-8"));n=[t["name"] for t in d["result"]["tools"]];assert "permutation_test" in n and "load_dataset" not in n,n;print("MCP tools/list OK:",n)'

  governance:
    # 评测与数据治理：数据版本登记 → 报告入库 → 配对比较 → 三类门禁 → 审计留痕。
    # 用仓库里冻结的真实报告（glm-4-flash 64 条），不调任何外部 API，结论必须与本地一致。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent
        uses: actions/checkout@v4

      - name: Checkout maldi-ms-platform (治理依赖，零第三方运行时依赖)
        uses: actions/checkout@v4
        with:
          repository: Wang-13137/maldi-ms-platform
          path: maldi-ms-platform

      - name: Checkout maldi-ms-pipeline (tests/conftest.py 依赖)
        # 跑 tests/ 下任何测试都要它：conftest 在收集阶段就会校验路径，
        # 少了它整个测试会话直接报错，不是跳过。
        uses: actions/checkout@v4
        with:
          repository: Wang-13137/maldi-ms-pipeline
          path: maldi-ms-pipeline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Governance pipeline
        env:
          MALDI_PLATFORM_SRC: ${{ github.workspace }}/maldi-ms-platform/src
          MALDI_PLATFORM_ACTOR: ci
        run: python eval/governance.py --out reports/governance.json

      - name: Governance tests
        env:
          MALDI_PIPELINE_SRC: ${{ github.workspace }}/maldi-ms-pipeline/src
          MALDI_PLATFORM_SRC: ${{ github.workspace }}/maldi-ms-platform/src
          MALDI_PLATFORM_ACTOR: ci
        run: pytest tests/test_governance.py -q

      - name: Upload governance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-report
          path: reports/governance.json
          if-no-files-found: warn

